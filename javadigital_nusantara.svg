<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">JavaDigital Nusantara - Customer Service</title>
  <desc id="desc">Logo Customer Service JavaDigital Nusantara: lingkaran putih dengan label merah dan ikon tiga kotak.</desc>

  <defs>
    <clipPath id="circleClip">
      <circle cx="512" cy="512" r="400"/>
    </clipPath>
  </defs>

  <!-- Latar belakang luar -->
  <rect id="bg-outer" x="0" y="0" width="1024" height="1024" fill="#0B0F12"/>

  <!-- Lingkaran utama -->
  <circle id="bg-circle" cx="512" cy="512" r="400" fill="#FFFFFF"/>

  <!-- Pola geometris halus + aksen merah (dipotong mengikuti lingkaran) -->
  <g id="accents" clip-path="url(#circleClip)">
    <!-- pola abu sangat halus -->
    <g fill="#F2F3F5">
      <polygon points="560,112 700,112 560,360 420,360"/>
      <polygon points="330,700 470,700 400,912 260,912"/>
      <polygon points="700,560 840,560 770,760 630,760"/>
    </g>
    <!-- aksen merah kiri atas -->
    <rect x="262" y="160" width="84" height="84" rx="16" transform="rotate(-18 304 202)"
          fill="none" stroke="#D71920" stroke-width="10"/>
    <!-- aksen merah kanan bawah -->
    <rect x="812" y="788" width="84" height="84" rx="16" transform="rotate(-18 854 830)"
          fill="none" stroke="#D71920" stroke-width="10"/>
  </g>

  <!-- Label Customer Service -->
  <g id="label">
    <rect x="239" y="382" width="546" height="84" rx="8" ry="8" fill="#D71920"/>
    <text x="512" y="438" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="42" font-weight="700" fill="#FFFFFF"
          textLength="470" lengthAdjust="spacingAndGlyphs">Customer Service</text>
  </g>

  <!-- Logo JavaDigital Nusantara -->
  <g id="logo">
    <!-- ikon tiga kotak -->
    <rect x="272" y="535" width="56" height="56" fill="#0B0F12"/>
    <rect x="272" y="599" width="56" height="56" fill="#0B0F12"/>
    <rect x="336" y="599" width="56" height="56" fill="#D71920"/>

    <!-- baris 1 -->
    <text x="412" y="580"
          font-family="'Arial Black', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="72" font-weight="900"
          textLength="350" lengthAdjust="spacingAndGlyphs"><tspan fill="#D71920">Java</tspan><tspan fill="#0B0F12">Digital</tspan></text>

    <!-- garis pemisah -->
    <line x1="412" y1="596" x2="762" y2="596" stroke="#0B0F12" stroke-width="4"/>

    <!-- baris 2 -->
    <text x="412" y="656"
          font-family="'Arial Black', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="72" font-weight="900" fill="#0B0F12"
          textLength="350" lengthAdjust="spacingAndGlyphs">nusantara</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
